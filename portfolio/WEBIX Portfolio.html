<!DOCTYPE html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WEBIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070B;--bg2:#0A0F1A;--p:#146BFF;--b:#2588FF;--t:#9AA6BA;--ln:rgba(80,140,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:#fff;font:400 16px/1.65 'Noto Sans Armenian',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
.w{width:min(1180px,100% - 40px);margin:auto}section{padding:110px 0;scroll-margin-top:70px;position:relative}
h2{font-size:clamp(30px,5vw,52px);line-height:1.15;font-weight:800;letter-spacing:-.02em}.sub{color:var(--t);max-width:620px;margin:14px 0 48px}
.g{background:linear-gradient(100deg,var(--b),#7FB4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.03);font-weight:500;cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--b);box-shadow:0 0 28px rgba(20,107,255,.3);transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--p),var(--b));border-color:transparent;box-shadow:0 8px 30px rgba(20,107,255,.35)}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(5,7,11,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}.hb img{height:34px;mix-blend-mode:screen}
nav{display:flex;gap:30px}nav a{color:var(--t);font-size:15px;transition:.2s;position:relative}nav a:hover{color:#fff}
.burger{display:none;width:44px;height:44px;border:1px solid var(--ln);border-radius:12px;background:none;cursor:pointer}
.burger i{display:block;width:18px;height:2px;background:#fff;margin:4px auto;transition:.3s}.open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}.open .burger i:nth-child(2){opacity:0}.open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.mm{display:none}
.hero{min-height:100svh;display:flex;align-items:center;padding:130px 0 80px;overflow:hidden;background:radial-gradient(60% 50% at 80% 40%,rgba(20,107,255,.22),transparent 70%),linear-gradient(var(--ln) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/72px 72px;-webkit-mask:none}
.hero h1{font-size:clamp(30px,7vw,88px);line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:880px}
.hero h3{font-size:clamp(18px,2.4vw,28px);font-weight:400;color:#cfd8e8;margin:26px 0 14px;max-width:620px}.hero p{color:var(--t);max-width:560px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.hw{position:absolute;right:-4%;top:50%;transform:translateY(-50%);width:min(560px,70vw);opacity:.55;pointer-events:none;filter:drop-shadow(0 0 40px rgba(20,107,255,.6))}
.hw path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s .2s cubic-bezier(.6,0,.2,1) forwards}@keyframes dr{to{stroke-dashoffset:0}}
.hero .w{position:relative;z-index:2}
.grid{display:grid;gap:20px}.s3{grid-template-columns:repeat(3,1fr)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01));border:1px solid var(--ln);border-radius:20px;padding:30px;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);border-color:rgba(37,136,255,.55);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(20,107,255,.18)}
.card h4{font-size:21px;margin:18px 0 10px}.card p{color:var(--t);font-size:15px}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgba(20,107,255,.14);color:var(--b);border:1px solid var(--ln)}.ic svg{width:26px;height:26px}
.card:after{content:"";position:absolute;left:30px;bottom:0;height:3px;width:36px;background:var(--b);border-radius:3px;transition:.4s}.card:hover:after{width:calc(100% - 60px)}
.ab{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:48px;border-radius:28px;background:radial-gradient(70% 90% at 100% 0,rgba(20,107,255,.2),transparent),var(--bg2);border:1px solid var(--ln)}
.ab p{color:#c4cee0;margin-top:16px}.ab img{width:100%;max-height:300px;object-fit:cover;border-radius:18px;border:1px solid var(--ln);margin-bottom:18px;background:#000}
.st{display:grid;grid-template-columns:1fr 1fr;gap:14px}.st div{border:1px solid var(--ln);border-radius:14px;padding:16px}.st b{font-size:30px;color:var(--b);display:block;line-height:1.2}.st span{color:var(--t);font-size:13px}
.pr{grid-template-columns:repeat(4,1fr)}.pc{padding:26px 22px 30px;display:flex;flex-direction:column}.pc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pc .n{font-weight:800;font-size:15px;color:var(--b);letter-spacing:.04em}.pc .ic{width:44px;height:44px}.pc .ln{height:2px;background:linear-gradient(90deg,var(--b),transparent);width:0;transition:width 1.2s .2s;margin-bottom:18px}.in .ln{width:100%}.pc h4{margin:0 0 10px;font-size:19px}
.pl{grid-template-columns:repeat(3,1fr)}.pl .btn{width:100%}.pl .card{display:flex;flex-direction:column}.pl h4{margin-top:0}
.pl ul{list-style:none;padding:0;margin:18px 0;flex:1}.pl li{padding:7px 0 7px 26px;position:relative;color:#cfd8e8;font-size:15px}.pl li:before{content:"";position:absolute;left:0;top:15px;width:12px;height:2px;background:var(--b)}
.pp{font-size:30px;font-weight:800;margin-bottom:18px}
.idea{text-align:center;padding:70px 30px;border-radius:30px;border:1px solid rgba(37,136,255,.4);background:radial-gradient(60% 120% at 50% 120%,rgba(20,107,255,.45),transparent),var(--bg2);box-shadow:0 0 80px rgba(20,107,255,.15)}
.idea h2{max-width:800px;margin:auto;font-size:clamp(26px,4vw,44px)}.idea p{color:#c4cee0;max-width:620px;margin:20px auto 34px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ct .big{font-size:clamp(18px,2.4vw,28px);font-weight:700;display:block;margin-top:6px;overflow-wrap:anywhere}.ct small{color:var(--t)}.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.soc a{display:flex;align-items:center;justify-content:center;gap:14px;min-height:72px;padding:0 18px;border-radius:16px;border:1px solid var(--ln);background:rgba(255,255,255,.03);transition:.25s}.soc a:hover{border-color:var(--b);box-shadow:0 0 30px rgba(20,107,255,.3);transform:translateY(-4px)}.soc svg{width:26px;height:26px;color:var(--b);flex:none}
.fg{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}footer{border-top:1px solid var(--ln);padding:48px 0 30px}.fg img{height:32px;mix-blend-mode:screen;display:block}.hb img{cursor:pointer}.fn{display:flex;gap:22px;flex-wrap:wrap;color:var(--t)}.fn a:hover{color:#fff}.fb{display:flex;justify-content:space-between;align-items:center;gap:12px 30px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid var(--ln);color:var(--t);font-size:14px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(max-width:1100px){.pr{grid-template-columns:repeat(2,1fr)}}@media(max-width:1000px){.s3,.pl{grid-template-columns:repeat(2,1fr)}.ab{grid-template-columns:1fr}}
@media(max-width:900px){nav,.hb>.btn{display:none}.burger{display:block}.mm{display:block;max-height:0;overflow:hidden;transition:max-height .4s;background:var(--bg)}.open .mm{max-height:480px;border-top:1px solid var(--ln)}.mm a{display:block;padding:14px 20px;color:var(--t)}.mm .btn{margin:10px 20px 18px;color:#fff}section{padding:80px 0}}
@media(max-width:640px){.s3,.pr,.pl,.ct{grid-template-columns:1fr}.ab{padding:28px}.hw{opacity:.25}.soc{gap:10px}.soc a{flex-direction:column;gap:6px;padding:10px 4px;font-size:13px;min-height:78px}.fb{flex-direction:column;align-items:flex-start}}@media(max-width:360px){.w{width:calc(100% - 28px)}.btn{padding:0 16px}.ab{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hw path{stroke-dashoffset:0}html{scroll-behavior:auto}}
h1,h2,h3,h4,p,li{overflow-wrap:anywhere}.card,.ab>*,.ct>*{min-width:0}img{max-width:100%}
.lgn{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 50% 0,rgba(20,107,255,.25),transparent),var(--bg)}.lb{width:min(420px,100%);padding:36px 30px}.lb:hover{transform:none}.lb img{height:40px;mix-blend-mode:screen;display:block;margin:0 auto 26px}.lb label{display:block;font-size:13px;color:var(--t);margin:14px 0 4px}.lb input{width:100%;background:#0d1320;border:1px solid var(--ln);border-radius:10px;padding:11px 13px;min-height:46px}.lb input:focus{outline:none;border-color:var(--b)}.er{color:#fff;background:rgba(20,107,255,.18);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:14px}
/* admin */
.ad{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.ad aside{border-right:1px solid var(--ln);padding:24px 16px;position:sticky;top:0;height:100vh;background:var(--bg2)}
.ad aside img{height:30px;mix-blend-mode:screen;margin:0 8px 24px}.ad aside button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;background:none;border-radius:10px;color:var(--t);cursor:pointer;min-height:44px}
.ad aside button.on,.ad aside button:hover{background:rgba(20,107,255,.16);color:#fff}.ad main{padding:34px;max-width:900px;width:100%}
.ad h2{font-size:30px;margin-bottom:6px}.note{color:var(--t);font-size:14px;margin-bottom:26px}
.ad label{display:block;font-size:13px;color:var(--t);margin:10px 0 4px}.ad input,.ad textarea,.ad select{width:100%;background:#0d1320;border:1px solid var(--ln);border-radius:10px;padding:11px 13px;min-height:44px}
.ad input:focus,.ad textarea:focus,.ad select:focus{outline:none;border-color:var(--b)}.ad textarea{min-height:90px;resize:vertical}
.ad .card{margin-bottom:16px;padding:22px}.ad .card:hover{transform:none}.ad .card:after{display:none}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}.sm{min-height:38px;padding:0 14px;font-size:14px}.dg{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.dg .card{cursor:pointer}.dg b{font-size:38px;color:var(--b);display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:800px){.ad{grid-template-columns:1fr}.ad aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:12px}.ad aside img{display:none}.ad aside button{width:auto}.ad main{padding:20px}.two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
